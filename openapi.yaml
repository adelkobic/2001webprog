openapi: 3.0.3
info:
  title: Library API
  version: 1.1.0
  description: CRUD API for library users, genres, books, rentals, and reviews, with Open Library book-cover lookup.
servers:
  - url: http://localhost:8000/api
    description: Local development API
tags:
  - name: Health
  - name: Authentication
  - name: Genres
  - name: Books
  - name: Users
  - name: Rentals
  - name: Reviews
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Book not found.
    Genre:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Fantasy }
    GenreInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100, example: Fantasy }
    Book:
      type: object
      properties:
        id: { type: integer, example: 3 }
        title: { type: string, example: The Hobbit }
        author: { type: string, example: J.R.R. Tolkien }
        isbn: { type: string, example: '9780547928227' }
        publisher: { type: string, example: Houghton Mifflin }
        publication_year: { type: integer, example: 2012 }
        genre_id: { type: integer, example: 2 }
        genre_name: { type: string, example: Fantasy }
        total_copies: { type: integer, minimum: 1, example: 2 }
        available_copies: { type: integer, example: 1 }
        description: { type: string }
    BookInput:
      type: object
      required: [title, author, isbn, publisher, publication_year, genre_id, total_copies, description]
      properties:
        title: { type: string, maxLength: 255 }
        author: { type: string, maxLength: 255 }
        isbn: { type: string, minLength: 10, maxLength: 13 }
        publisher: { type: string, maxLength: 255 }
        publication_year: { type: integer, minimum: 1000 }
        genre_id: { type: integer, minimum: 1 }
        total_copies: { type: integer, minimum: 1 }
        description: { type: string, maxLength: 1000 }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        first_name: { type: string, example: Alex }
        last_name: { type: string, example: Reader }
        email: { type: string, format: email, example: patron@library.local }
        phone: { type: string, example: '061000003' }
        role: { type: string, enum: [admin, staff, patron] }
        created_at: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [first_name, last_name, email, phone, password]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 6, maxLength: 30 }
        password: { type: string, minLength: 6, format: password }
    UserCreateInput:
      allOf:
        - $ref: '#/components/schemas/RegisterInput'
        - type: object
          required: [role]
          properties:
            role: { type: string, enum: [admin, staff, patron] }
    UserUpdateInput:
      type: object
      required: [first_name, last_name, email, phone, role]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        email: { type: string, format: email }
        phone: { type: string, minLength: 6, maxLength: 30 }
        role: { type: string, enum: [admin, staff, patron] }
        password: { type: string, minLength: 6, format: password }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }
    Rental:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        book_id: { type: integer }
        created_by: { type: integer }
        rented_at: { type: string, format: date }
        due_date: { type: string, format: date }
        returned_at: { type: string, format: date, nullable: true }
        status: { type: string, enum: [active, overdue, returned] }
        patron_first_name: { type: string }
        patron_last_name: { type: string }
        book_title: { type: string }
        staff_first_name: { type: string }
        staff_last_name: { type: string }
    RentalCreateInput:
      type: object
      required: [user_id, book_id, due_date]
      properties:
        user_id: { type: integer, minimum: 1 }
        book_id: { type: integer, minimum: 1 }
        due_date: { type: string, format: date }
    RentalUpdateInput:
      type: object
      required: [user_id, book_id, due_date, status]
      properties:
        user_id: { type: integer, minimum: 1 }
        book_id: { type: integer, minimum: 1 }
        due_date: { type: string, format: date }
        status: { type: string, enum: [active, overdue, returned] }
        returned_at:
          type: string
          format: date
          nullable: true
          description: Required only to set a specific return date for a returned rental; otherwise defaults to today.
    RentalReturnInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [returned] }
    Review:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        book_id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
        created_at: { type: string, format: date-time }
        first_name: { type: string }
        last_name: { type: string }
        book_title: { type: string }
    ReviewInput:
      type: object
      required: [book_id, rating, comment]
      properties:
        book_id: { type: integer, minimum: 1 }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
    ReviewUpdateInput:
      type: object
      required: [rating, comment]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 500 }
    CoverResponse:
      type: object
      required: [cover_url, message]
      properties:
        cover_url: { type: string, format: uri, nullable: true }
        message: { type: string }
  responses:
    BadRequest:
      description: Invalid input or a business rule prevents the operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Authentication token is missing, invalid, or expired.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The authenticated user does not have permission.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: The resource conflicts with an existing unique value.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected server or database error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  parameters:
    ResourceId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        minimum: 1
paths:
  /health:
    get:
      tags: [Health]
      summary: Check API health
      responses:
        '200':
          description: API is running.
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a patron account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201':
          description: Patron account created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Authenticated user and token.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/me:
    get:
      tags: [Authentication]
      summary: Return the current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current JWT claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /openapi.yaml:
    get:
      tags: [Health]
      summary: Download this OpenAPI document
      responses:
        '200':
          description: OpenAPI YAML document.
        '500': { $ref: '#/components/responses/ServerError' }
  /genres:
    get:
      tags: [Genres]
      summary: List genres
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Genre list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Genre' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Genres]
      summary: Create a genre (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenreInput' }
      responses:
        '201':
          description: Genre created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Genre' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /genres/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Genres]
      summary: Get a genre
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Genre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Genre' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Genres]
      summary: Replace a genre (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenreInput' }
      responses:
        '200':
          description: Updated genre.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Genre' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Genres]
      summary: Delete a genre (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Genre deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /books:
    get:
      tags: [Books]
      summary: Search/list books
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: genre_id
          schema: { type: integer }
      responses:
        '200':
          description: Matching books.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Books]
      summary: Create a book (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '201':
          description: Book created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Books]
      summary: Get a book
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Book.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Books]
      summary: Replace a book (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '200':
          description: Updated book.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Books]
      summary: Delete a book (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Book deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /books/cover:
    get:
      tags: [Books]
      summary: Look up a book cover using Open Library
      description: Public read-only endpoint for the catalog. Accepts the ISBN directly so it also works while the frontend is using static book fixtures. If metadata lookup fails or has no cover, returns the ISBN-based covers.openlibrary.org URL; the frontend uses its local placeholder if that image is unavailable too.
      parameters:
        - in: query
          name: isbn
          required: true
          schema:
            type: string
            minLength: 10
            maxLength: 13
          example: '9780547928227'
      responses:
        '200':
          description: Cover URL or fallback message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/ServerError' }
  /users:
    get:
      tags: [Users]
      summary: List users (admin/staff)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [admin, staff, patron] }
      responses:
        '200':
          description: Users; staff access is limited to patron records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Users]
      summary: Create a user (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreateInput' }
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Users]
      summary: Get a user (admin/staff)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Public user fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Users]
      summary: Replace a user (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdateInput' }
      responses:
        '200':
          description: Updated public user fields.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Users]
      summary: Delete a user (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: User deleted. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /rentals:
    get:
      tags: [Rentals]
      summary: List rentals visible to the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Patrons receive only their rentals; staff/admin receive all rentals.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rental' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Rentals]
      summary: Create a rental (staff/admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentalCreateInput' }
      responses:
        '201':
          description: Rental created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /rentals/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Rentals]
      summary: Get a rental
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Rental; patrons can access only their own.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Rentals]
      summary: Replace mutable rental details (staff/admin)
      description: Requires user_id, book_id, due_date and status. Status for non-returned rentals is derived from the due date. The original rental date and creator are preserved.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RentalUpdateInput' }
      responses:
        '200':
          description: Updated rental.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Rentals]
      summary: Delete a rental (admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Rental deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /rentals/{id}/return:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    patch:
      tags: [Rentals]
      summary: Mark a rental as returned (staff/admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Returned rental.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /reviews:
    get:
      tags: [Reviews]
      summary: List reviews
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: book_id
          schema: { type: integer }
      responses:
        '200':
          description: Reviews, optionally filtered by book.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [Reviews]
      summary: Create or replace the current patron's review
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201':
          description: Saved review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /reviews/{id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Reviews]
      summary: Get a review
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    put:
      tags: [Reviews]
      summary: Update a review (owner/admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewUpdateInput' }
      responses:
        '200':
          description: Updated review.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      tags: [Reviews]
      summary: Delete a review (owner/admin)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Review deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
