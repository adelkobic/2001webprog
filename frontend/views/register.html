<h1 class="h3 mb-3">Register</h1>
<p>New accounts are patrons. An admin creates staff accounts.</p>
<div id="form-error" class="alert alert-danger d-none"></div>
<div id="form-success" class="alert alert-success d-none"></div>
<form id="register-form" class="card card-body" style="max-width: 520px;">
    <div class="mb-3">
        <label class="form-label" for="first_name">First name</label>
        <input class="form-control" id="first_name" required maxlength="100">
    </div>
    <div class="mb-3">
        <label class="form-label" for="last_name">Last name</label>
        <input class="form-control" id="last_name" required maxlength="100">
    </div>
    <div class="mb-3">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" type="email" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="phone">Phone</label>
        <input class="form-control" id="phone" required maxlength="30">
    </div>
    <div class="mb-3">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" type="password" required minlength="6">
    </div>
    <button class="btn btn-primary" type="submit">Create account</button>
</form>
<p class="mt-3">Already registered? <a href="#/login">Login</a></p>
