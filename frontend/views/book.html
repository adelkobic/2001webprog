<p><a href="#/catalog">Back to catalog</a></p>
<div id="page-alert" class="alert alert-danger d-none"></div>
<div id="book-detail"></div>
<h2 class="h4 mt-4">Reviews</h2>
<div id="review-list"></div>
<form id="review-form" class="card card-body mt-3 d-none" style="max-width: 520px;">
    <h2 class="h5">Your review</h2>
    <div id="review-error" class="alert alert-danger d-none"></div>
    <div class="mb-3">
        <label class="form-label" for="rating">Rating (1 to 5)</label>
        <input class="form-control" id="rating" type="number" min="1" max="5" required>
    </div>
    <div class="mb-3">
        <label class="form-label" for="comment">Comment</label>
        <textarea class="form-control" id="comment" rows="3" required maxlength="500"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Save review</button>
</form>
